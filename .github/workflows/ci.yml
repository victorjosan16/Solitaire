name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  quality:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Localization catalogs are in sync with tool/l10n
        run: |
          python3 tool/l10n/build_arbs.py
          flutter gen-l10n
          git diff --exit-code -- lib/app/l10n
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze (zero issues)
        run: flutter analyze
      - name: Unit, widget and integration-style tests
        run: flutter test --exclude-tags golden --reporter expanded
      - name: Golden screenshots
        # Goldens are rendered on Linux; font rasterization can differ slightly
        # between runner images, so a mismatch is reported but not blocking.
        continue-on-error: true
        run: flutter test --tags golden
      - name: Upload golden failures
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/golden/failures/
          if-no-files-found: ignore

  android:
    name: Android debug APK
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the debug pre-release
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Release preview APK (R8, Google TEST ads, debug-signed)
        # Smooth, small build for testing on a phone before Play is live.
        # Test ad units on purpose: never click your own live ads.
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=ADMOB_BANNER_ANDROID=ca-app-pub-3940256099942544/6300978111 \
            --dart-define=ADMOB_REWARDED_ANDROID=ca-app-pub-3940256099942544/5224354917
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk solitaire-nova-preview-${{ github.run_number }}.apk
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk solitaire-nova-debug-${{ github.run_number }}.apk
      - name: Upload artifact
        # Account artifact storage can be full; the release below is the
        # reliable download location.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: solitaire-nova-debug-apk
          path: solitaire-nova-debug-${{ github.run_number }}.apk
      - name: Publish debug APK as a pre-release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Solitaire Nova debug build ${{ github.run_number }}
          body: |
            Built from ${{ github.ref_name }} @ ${{ github.sha }}. For testing only (Google test ads, debug signing, not for Google Play).
            * solitaire-nova-preview-*.apk: release mode, fast and small (64-bit phones, almost all from 2017+). Install this one.
            * solitaire-nova-debug-*.apk: debug mode, slower, for troubleshooting.
            The Google Play version has a different signature: uninstall these before installing from Play.
          prerelease: true
          make_latest: false
          files: |
            solitaire-nova-preview-${{ github.run_number }}.apk
            solitaire-nova-debug-${{ github.run_number }}.apk
